<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>

<style>
/* Layout: full-viewport CAD workbench - toolbar over the 3D view (left), fixed inspector column (right) */
:root{
  --bg:#eef1f4; --panel:#f8f9fb; --ink:#1c232b; --muted:#5d6874; --line:#d3d9e0; --chip:#e3e8ee;
  --accent:#b8611f; --sel:#ff7a1a; --meas:#d026c8; --grid:#a8562e; --weight:#c4271f; --view:#dfe4ea;
  --font:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif; --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#14181d; --panel:#1b2027; --ink:#e3e8ee; --muted:#93a0ad; --line:#2f3741; --chip:#262d36;
  --accent:#e08a45; --sel:#ff8f3a; --meas:#ee55e6; --grid:#d7865a; --weight:#ff5a4f; --view:#e8ecf0; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#14181d; --panel:#1b2027; --ink:#e3e8ee; --muted:#93a0ad; --line:#2f3741; --chip:#262d36;
  --accent:#e08a45; --sel:#ff8f3a; --meas:#ee55e6; --grid:#d7865a; --weight:#ff5a4f; --view:#e8ecf0; color-scheme:dark}
html,body{height:100%;overflow:hidden}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:13px}
#app{height:100%;display:grid;grid-template-columns:minmax(0,1fr) 340px;grid-template-rows:auto minmax(0,1fr);
  padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
#tb{grid-column:1;grid-row:1;display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:8px 10px;border-bottom:1px solid var(--line);background:var(--panel)}
#tb .sep{width:1px;height:22px;background:var(--line);margin:0 4px}
button,.chip{font:inherit;font-size:12px;color:var(--ink);background:var(--chip);border:1px solid var(--line);border-radius:5px;padding:5px 9px;cursor:pointer;white-space:nowrap}
button:hover{border-color:var(--accent)}
button:focus-visible,input:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
button.on{background:var(--accent);color:#fff;border-color:var(--accent)}
#view{grid-column:1;grid-row:2;position:relative;overflow:hidden;background:var(--view)}
#view canvas{display:block;width:100%;height:100%;touch-action:none}
#ov{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.lbl{position:absolute;transform:translate(-50%,-50%);font-family:var(--mono);font-size:11px;white-space:nowrap;padding:1px 4px;border-radius:3px}
.glbl{color:var(--grid);background:color-mix(in srgb,var(--view) 80%,transparent)}
.gbub{color:var(--grid);border:1.5px solid var(--grid);border-radius:50%;min-width:26px;height:26px;display:flex;align-items:center;justify-content:center;background:var(--view);font-weight:500;padding:0 3px}
.ttag{color:var(--ink);background:var(--panel);border:1px solid var(--line);font-family:var(--font);font-weight:600;font-size:12px}
.mlbl{color:#fff;background:var(--meas);font-weight:500}
#readout{position:absolute;left:10px;bottom:10px;font-family:var(--mono);font-size:11px;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:3px 7px;pointer-events:none}
#toast{position:absolute;left:50%;top:12px;transform:translateX(-50%);background:var(--ink);color:var(--panel);padding:5px 12px;border-radius:5px;font-size:12px;opacity:0;transition:opacity .2s;pointer-events:none}
#toast.show{opacity:.92}
#load{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:14px}
#panel{grid-column:2;grid-row:1 / span 2;overflow-y:auto;border-left:1px solid var(--line);background:var(--panel);padding-bottom:env(safe-area-inset-bottom,0px)}
details{border-bottom:1px solid var(--line)}
.kgm{color:var(--weight);font-weight:700;font-size:16px}
#card{padding:14px 14px 12px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:4px}
#card .ct{font:700 20px/1.25 var(--font);color:var(--ink)}
#card .cd{font:400 13px/1.4 var(--font);color:var(--muted)}
#card .cr{font:400 12px/1.4 var(--mono);color:var(--ink);overflow-wrap:anywhere}
#card .cn{font:400 14px/1.4 var(--font);color:var(--ink);font-variant-numeric:tabular-nums}
#card .cn b{color:var(--weight);font-weight:700}
summary{list-style:none;cursor:pointer;padding:10px 14px;font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);display:flex;gap:8px;align-items:center}
summary::-webkit-details-marker{display:none}
summary::before{content:"▸";font-size:11px}
details[open]>summary::before{content:"▾"}
.sec{padding:0 14px 12px;display:flex;flex-direction:column;gap:8px}
.crumbs{display:flex;flex-wrap:wrap;gap:4px}
.crumbs button{font-size:11px;padding:3px 7px}
.info{font-size:12px;line-height:1.5}
.info .mark{font-family:var(--mono);font-size:14px;font-weight:500}
.info dl{display:grid;grid-template-columns:88px minmax(0,1fr);gap:2px 8px;margin:6px 0 0}
.info dt{color:var(--muted)} .info dd{margin:0;min-width:0;overflow-wrap:anywhere;font-variant-numeric:tabular-nums}
.wt{color:var(--weight);font-weight:700;font-size:22px;font-variant-numeric:tabular-nums}
.btns{display:flex;flex-wrap:wrap;gap:5px}
input[type=text]{font:inherit;font-size:12px;width:100%;box-sizing:border-box;padding:6px 8px;border:1px solid var(--line);border-radius:5px;background:var(--bg);color:var(--ink)}
.res{max-height:180px;overflow-y:auto;display:flex;flex-direction:column}
.res button{text-align:left;background:none;border:none;border-bottom:1px solid var(--line);border-radius:0;font-family:var(--mono);font-size:11.5px;display:flex;justify-content:space-between;gap:8px}
.row{display:flex;align-items:center;gap:8px}
.lay{display:grid;grid-template-columns:18px 14px minmax(0,1fr) auto;align-items:center;gap:6px;font-size:12px}
.sw{width:14px;height:14px;border-radius:3px;cursor:pointer;border:1px solid var(--line)}
.lay .nm{cursor:pointer;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lay .ct{color:var(--muted);font-variant-numeric:tabular-nums;font-size:11px}
.op{grid-column:2 / span 3;display:flex;gap:6px;align-items:center;font-size:11px;color:var(--muted)}
.op input{flex:1}
.sub{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-top:4px}
.key{display:flex;flex-wrap:wrap;gap:4px 10px;font-size:11px;color:var(--muted)}
.key span{display:inline-flex;align-items:center;gap:4px}
.key svg{width:12px;height:12px}
.notes{font-size:12px;line-height:1.5;color:var(--ink)} .notes ul{margin:4px 0 8px;padding-left:16px} .notes li{margin-bottom:3px}
select{font:inherit;font-size:12px;padding:4px;border:1px solid var(--line);border-radius:5px;background:var(--bg);color:var(--ink)}
input[type=range]{accent-color:var(--accent)}
input[type=checkbox]{accent-color:var(--accent);margin:0}
@media (max-width:820px){
  #app{grid-template-columns:minmax(0,1fr) min(340px,46vw)}
  #tb{padding-left:max(10px,env(safe-area-inset-left,0px));padding-right:max(10px,env(safe-area-inset-right,0px))}
}
@media (prefers-reduced-motion:reduce){#toast{transition:none}}
</style>

<div id="app">
  <div id="tb" role="toolbar" aria-label="Views">
    <button id="vIso">ISO</button><button id="vPlan">Plan</button><button id="vFront">Elevation front</button><button id="vSide">Elevation side</button>
    <span class="sep"></span><span id="chips" style="display:contents"></span><span class="sep"></span>
    <button id="bGrid" class="on">Grid</button><button id="bLab" class="on">Labels</button><button id="bMeas">Measure</button>
  </div>
  <div id="view"><div id="load">Loading model…</div><div id="ov"></div><div id="readout" hidden></div><div id="toast"></div></div>
  <aside id="panel">
    <div id="card"><div class="ct" id="cTitle"></div><div class="cd" id="cDesc"></div><div class="cr" id="cRef"></div><div class="cn" id="cCount"></div></div>
    <details open id="dSel"><summary>Select</summary><div class="sec">
      <div class="crumbs" id="crumbs"></div>
      <div class="info" id="info"><span style="color:var(--muted)">Tap a member to select it. Tap again to step up to its lift unit and tower.</span></div>
      <div class="btns" id="prevnext" hidden><button id="bPrev">Prev</button><button id="bNext">Next</button><button id="bAllInst">Show all</button></div>
      <div class="btns"><button id="bOnly">Show only</button><button id="bShowAll">Show all</button><button id="bHide">Hide</button></div>
      <div class="btns"><button id="bSelAll">Select all</button><button id="bUndo">Undo</button><button id="bExport">Export</button></div>
      <input type="text" id="q" placeholder="Search, e.g. UC, C, PLT, BR." autocomplete="off">
      <div class="res" id="res"></div>
    </div></details>
    <details id="dCut"><summary>Section</summary><div class="sec">
      <div class="row"><select id="cutDir" aria-label="Section direction"><option value="top">Top</option><option value="left">Left</option><option value="right">Right</option><option value="front">Front</option><option value="back">Back</option></select>
        <button id="cutOn">Section on</button><button id="cutOff">Clear section</button></div>
      <input type="range" id="cutPos" min="0" max="1000" value="500" aria-label="Section position">
    </div></details>
    <details id="dLay"><summary>Layers</summary><div class="sec">
      <div id="layers" style="display:flex;flex-direction:column;gap:5px"></div>
      <div class="sub">Annotation</div>
      <label class="row"><input type="checkbox" id="cLabels" checked> Labels (tags, grid dimensions, measurements)</label>
      <div class="sub">Towers</div>

    </div></details>
    <details id="dMeas"><summary>Measure</summary><div class="sec">
      <div class="row"><label class="row"><input type="checkbox" id="cMag" checked> Magnet</label><label class="row"><input type="checkbox" id="cLock" checked> Lock to 90°</label></div>
      <div class="key">
        <span><svg viewBox="0 0 12 12"><rect x="2" y="2" width="8" height="8" fill="none" stroke="currentColor" stroke-width="1.5"/></svg>Corner</span>
        <span><svg viewBox="0 0 12 12"><path d="M6 1 L11 6 L6 11 L1 6Z" fill="none" stroke="currentColor" stroke-width="1.5"/></svg>Midpoint</span>
        <span><svg viewBox="0 0 12 12"><circle cx="6" cy="6" r="5" fill="none" stroke="currentColor" stroke-width="1.2"/><circle cx="6" cy="6" r="2.2" fill="none" stroke="currentColor" stroke-width="1.2"/></svg>Centre</span>
        <span><svg viewBox="0 0 12 12"><circle cx="6" cy="6" r="4.5" fill="none" stroke="currentColor" stroke-width="1.5"/></svg>Grid</span>
        <span><svg viewBox="0 0 12 12"><circle cx="6" cy="6" r="4.5" fill="none" stroke="currentColor" stroke-width="1.3" stroke-dasharray="2 1.6"/></svg>Surface</span>
      </div>
      <div class="btns"><button id="bMeas2">Measure</button><button id="bClrMeas">Clear all</button></div>
    </div></details>
    <details id="dNotes"><summary>Notes</summary><div class="sec notes" id="notes"></div></details>
  </aside>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js"></script>
<script id="d64" type="application/octet-stream">@@DATA@@</script>
<script>
"use strict";
const $ = id => document.getElementById(id);
let D, parts = [], scene, camera, renderer, controls, raycaster = new THREE.Raycaster();
let C0 = [0, 0, 0]; // model offset (mm)
const W = (x, y, z) => new THREE.Vector3((x - C0[0]) / 1000, (z - C0[2]) / 1000, -(y - C0[1]) / 1000);
const fmt = (v, d = 0) => v.toLocaleString('en-US', {minimumFractionDigits: d, maximumFractionDigits: d});
function toast(t){ const e = $('toast'); e.textContent = t; e.classList.add('show'); clearTimeout(toast.h); toast.h = setTimeout(() => e.classList.remove('show'), 1800); }
function css(v){ return getComputedStyle(document.documentElement).getPropertyValue(v).trim(); }

async function loadData(){
  const b64 = $('d64').textContent.trim();
  const bin = Uint8Array.from(atob(b64), c => c.charCodeAt(0));
  if (typeof DecompressionStream === 'undefined') throw new Error('This browser cannot unpack the model data (DecompressionStream missing). Open the page in a current Chrome, Edge, Safari or Firefox.');
  const ds = new Blob([bin]).stream().pipeThrough(new DecompressionStream('gzip'));
  return JSON.parse(await new Response(ds).text());
}

/* ---------------- state ---------------- */
const S = { hidden: new Set(), towerOff: new Set(), layerOff: new Set(), layerOp: {}, sel: [], selChain: [], selLevel: 0, inst: null, instI: 0,
  undo: [], measure: false, meas: [], pending: null, labels: true, grid: true, cut: null };
let layerMeshes = [], layerEdges = [], ghostObjs = [], selMesh = null, selBox = null, clipPlanes = [];
let gridGroup, gridLabels = [], towerTags = [], occCache = {key: '', vis: {}};

function visible(i){ const p = parts[i]; return !S.hidden.has(i) && !S.towerOff.has(p.unit) && !S.layerOff.has(p.layer); }

/* ---------------- geometry ---------------- */
function prepParts(){
  let lo = [1e9, 1e9, 1e9], hi = [-1e9, -1e9, -1e9];
  for (const p of D.parts) for (const pr of p.pr) for (const f of pr) for (const v of f) for (let k = 0; k < 3; k++){ lo[k] = Math.min(lo[k], v[k]); hi[k] = Math.max(hi[k], v[k]); }
  C0 = [(lo[0] + hi[0]) / 2, (lo[1] + hi[1]) / 2, (D.meta.datum_z ?? lo[2])];
  D.parts.forEach((p, i) => {
    const pos = [], nor = [], edges = [], corners = [], mids = [], cents = [];
    const ax = new THREE.Vector3(p.ax[0], p.ax[2], -p.ax[1]).normalize();
    const caps = {};
    for (const pr of p.pr){
      const seen = new Set();
      for (const f of pr){
        const V = f.map(v => W(v[0], v[1], v[2]));
        const n = new THREE.Vector3();
        for (let k = 0; k < V.length; k++){ const a = V[k], b = V[(k + 1) % V.length]; n.x += (a.y - b.y) * (a.z + b.z); n.y += (a.z - b.z) * (a.x + b.x); n.z += (a.x - b.x) * (a.y + b.y); }
        n.normalize();
        for (let k = 1; k < V.length - 1; k++) for (const q of [V[0], V[k], V[k + 1]]){ pos.push(q.x, q.y, q.z); nor.push(n.x, n.y, n.z); }
        // polygon centroid (area weighted)
        let A = 0; const c = new THREE.Vector3();
        for (let k = 1; k < V.length - 1; k++){ const t = new THREE.Vector3().subVectors(V[k], V[0]).cross(new THREE.Vector3().subVectors(V[k + 1], V[0])).length() / 2; A += t; c.addScaledVector(new THREE.Vector3().add(V[0]).add(V[k]).add(V[k + 1]).multiplyScalar(1 / 3), t); }
        if (A > 0) c.multiplyScalar(1 / A); cents.push(c);
        if (Math.abs(n.dot(ax)) > 0.999){ const key = Math.round(V[0].dot(ax) * 1000); (caps[key] = caps[key] || {A: 0, c: new THREE.Vector3()}); caps[key].A += A; caps[key].c.addScaledVector(c, A); }
        for (let k = 0; k < V.length; k++){
          const a = V[k], b = V[(k + 1) % V.length];
          edges.push(a.x, a.y, a.z, b.x, b.y, b.z);
          mids.push(new THREE.Vector3().addVectors(a, b).multiplyScalar(0.5));
          const key = a.x.toFixed(4) + ',' + a.y.toFixed(4) + ',' + a.z.toFixed(4);
          if (!seen.has(key)){ seen.add(key); corners.push(a.clone()); }
        }
      }
    }
    for (const k in caps) if (caps[k].A > 0) cents.push(caps[k].c.multiplyScalar(1 / caps[k].A));
    const box = new THREE.Box3(); for (let k = 0; k < pos.length; k += 3) box.expandByPoint(new THREE.Vector3(pos[k], pos[k + 1], pos[k + 2]));
    const sloped = Math.max(Math.abs(p.ax[0]), Math.abs(p.ax[1]), Math.abs(p.ax[2])) < 0.9995;
    parts.push(Object.assign({}, p, {i, pos: new Float32Array(pos), nor: new Float32Array(nor), edges: new Float32Array(edges), corners, mids, cents, box, sphere: box.getBoundingSphere(new THREE.Sphere()), axw: ax, sloped}));
    delete parts[i].pr;
  });
  D.parts = null;
}

function mat(color, op){
  return new THREE.MeshStandardMaterial({color, metalness: 0.25, roughness: 0.62, side: THREE.DoubleSide, transparent: op < 1, opacity: op, depthWrite: op >= 0.5, clippingPlanes: clipPlanes, polygonOffset: true, polygonOffsetFactor: 1, polygonOffsetUnits: 1});
}
function buildLayers(){
  for (const m of layerMeshes) if (m){ scene.remove(m); m.geometry.dispose(); }
  for (const m of layerEdges) if (m){ scene.remove(m); m.geometry.dispose(); }
  layerMeshes = []; layerEdges = [];
  D.layers.forEach((L, li) => {
    if (L.k === 'ghost'){ layerMeshes.push(null); layerEdges.push(null); return; }
    const ids = parts.filter(p => p.layer === li && visible(p.i)).map(p => p.i);
    let n = 0, ne = 0; for (const i of ids){ n += parts[i].pos.length; ne += parts[i].edges.length; }
    const pos = new Float32Array(n), nor = new Float32Array(n), tri = new Int32Array(n / 9), ep = new Float32Array(ne);
    let o = 0, t = 0, oe = 0;
    for (const i of ids){ const p = parts[i]; pos.set(p.pos, o); nor.set(p.nor, o); for (let k = 0; k < p.pos.length / 9; k++) tri[t++] = i; o += p.pos.length; ep.set(p.edges, oe); oe += p.edges.length; }
    const g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.BufferAttribute(pos, 3)); g.setAttribute('normal', new THREE.BufferAttribute(nor, 3));
    const op = S.layerOp[li] ?? 1;
    const m = new THREE.Mesh(g, mat(new THREE.Color(L.c), op)); m.userData = {li, tri}; m.frustumCulled = false;
    scene.add(m); layerMeshes.push(m);
    const ge = new THREE.BufferGeometry(); ge.setAttribute('position', new THREE.BufferAttribute(ep, 3));
    const le = new THREE.LineSegments(ge, new THREE.LineBasicMaterial({color: 0x10161c, transparent: true, opacity: 0.18 * op, clippingPlanes: clipPlanes}));
    le.frustumCulled = false; scene.add(le); layerEdges.push(le);
  });
  const gl = D.layers.findIndex(l => l.k === 'ghost');
  for (const o of ghostObjs) o.visible = !S.layerOff.has(gl) && S.ghostShown !== false;
  occCache.key = '';
  updateSelMesh(); updateCounts();
}
function buildGhosts(){
  const gl = D.layers.findIndex(l => l.k === 'ghost');
  const op = S.layerOp[gl] ?? 0.15;
  for (const g of D.ghosts){
    const geo = g.r ? new THREE.CylinderGeometry(g.r / 1000, g.r / 1000, g.s[2] / 1000, 24) : new THREE.BoxGeometry(g.s[0] / 1000, g.s[2] / 1000, g.s[1] / 1000);
    const m = new THREE.Mesh(geo, new THREE.MeshStandardMaterial({color: 0x9aa3ad, transparent: true, opacity: op, depthWrite: false, clippingPlanes: clipPlanes}));
    m.position.copy(W(g.c[0], g.c[1], g.c[2]));
    const e = new THREE.LineSegments(new THREE.EdgesGeometry(geo), new THREE.LineBasicMaterial({color: 0x6f7a85, transparent: true, opacity: 0.6, clippingPlanes: clipPlanes}));
    m.add(e); m.userData.ghost = g; scene.add(m); ghostObjs.push(m);
  }
}

/* ---------------- selection ---------------- */
function chainFor(i){
  const p = parts[i];
  const lv = [['Part', [i], undefined]];
  if (p.sub >= 0) lv.push(['Sub-assembly', parts.filter(q => q.sub === p.sub).map(q => q.i), p.sub]);
  lv.push(['Assembly', parts.filter(q => q.asm === p.asm).map(q => q.i), p.asm]);
  lv.push([D.groups[p.lu].label || 'Lift unit', parts.filter(q => q.lu === p.lu).map(q => q.i), p.lu]);
  lv.push([D.groups[p.tw].label || 'Tower', parts.filter(q => q.tw === p.tw).map(q => q.i), p.tw]);
  const ch = [];
  for (const [name, ids, g] of lv){
    const prev = ch[ch.length - 1];
    if (prev && prev.ids.length === ids.length){ prev.name += ' = ' + name; if (g !== undefined) prev.g = g; continue; }
    ch.push({name, ids, g});
  }
  return ch;
}
function select(ids, chain, level){
  S.sel = ids; S.selChain = chain || []; S.selLevel = level || 0; updateSelMesh(); renderInfo();
}
function updateSelMesh(){
  if (selMesh){ scene.remove(selMesh); selMesh.geometry.dispose(); selMesh = null; }
  if (selBox){ scene.remove(selBox); selBox = null; }
  const ids = S.sel.filter(visible); if (!ids.length) return;
  let n = 0; for (const i of ids) n += parts[i].pos.length;
  const pos = new Float32Array(n), nor = new Float32Array(n); let o = 0;
  for (const i of ids){ pos.set(parts[i].pos, o); nor.set(parts[i].nor, o); o += parts[i].pos.length; }
  const g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.BufferAttribute(pos, 3)); g.setAttribute('normal', new THREE.BufferAttribute(nor, 3));

    const dc = p.sphere.center.distanceTo(camera.position);
    if (ray.distanceToPoint(p.sphere.center) > p.sphere.radius + tolPx * worldPerPx(dc)) continue;
    for (const [arr, kind, bias] of [[p.corners, 'corner', 0], [p.mids, 'mid', 2], [p.cents, 'centre', 3]]) for (const q of arr){
      const s = proj(q); if (s[2] > 1 || s[2] < -1) continue; const d = Math.hypot(s[0] - mx, s[1] - my); if (d <= tolPx) cand.push({p: q, kind, part: p.i, d: d + bias});
    }
  }
  if (S.grid) for (const q of D.gridPts){ const s = proj(q); if (s[2] > 1 || s[2] < -1) continue; const d = Math.hypot(s[0] - mx, s[1] - my); if (d <= tolPx) cand.push({p: q, kind: 'grid', part: -1, d: d + 1}); }
  cand.sort((a, b) => a.d - b.d);
  for (const c of cand.slice(0, 40)){ if (c.kind !== 'grid' && !keptByCut(c.p)) continue; if (c.kind === 'grid' || los(c.p)) return c; }
  return hit ? {p: hit.point, kind: 'surface', part: hit.i} : null;
}
function lockB(A, B, shift){
  if (!$('cLock').checked || shift) return {p: B.p, locked: false};
  const pa = A.part >= 0 ? parts[A.part] : null, pb = B.part >= 0 ? parts[B.part] : null;
  const d = new THREE.Vector3().subVectors(B.p, A.p);
  if (pa && pb && pa === pb && pa.sloped) return {p: B.p, locked: false};
  const dn = d.clone().normalize();
  for (const q of [pa, pb]) if (q && q.sloped && Math.abs(dn.dot(q.axw)) > Math.cos(THREE.MathUtils.degToRad(8))) return {p: B.p, locked: false};
  const a = [Math.abs(d.x), Math.abs(d.y), Math.abs(d.z)]; const k = a.indexOf(Math.max(...a));
  const P = A.p.clone(); if (k === 0) P.x = B.p.x; if (k === 1) P.y = B.p.y; if (k === 2) P.z = B.p.z;
  return {p: P, locked: true, axis: ['dX', 'dZ', 'dY'][k]};
}
function measLabel(A, Bp, lk){ const L = A.p.distanceTo(Bp) * 1000; const v = Math.abs(L - Math.round(L)) < 0.05 ? fmt(Math.round(L)) : fmt(L, 1); return (lk.locked ? lk.axis + ' ' : '') + v + ' mm'; }
function addMeasurement(A, B, shift){
  const lk = lockB(A, B, shift); const Bp = lk.p;
  const g = new THREE.Group();
  const lm = new THREE.LineBasicMaterial({color: new THREE.Color(css('--meas') || '#d026c8'), depthTest: false, transparent: true});
  const ln = new THREE.Line(new THREE.BufferGeometry().setFromPoints([A.p, Bp]), lm); ln.renderOrder = 9; g.add(ln);
  for (const q of [A.p, Bp]){ const s = new THREE.Sprite(MK.corner); s.position.copy(q); s.renderOrder = 10; g.add(s); s.userData.end = true; }
  scene.add(g);
  const el = mkLbl('mlbl', measLabel(A, Bp, lk));
  const m = {obj: g, el, mid: new THREE.Vector3().addVectors(A.p, Bp).multiplyScalar(0.5)}; S.meas.push(m);
  m.obj.visible = S.labels; el.hidden = !S.labels;
}
function undoMeasure(){
  if (S.pending){ clearPending(); toast('Point A cleared'); return; }
  const m = S.meas.pop(); if (!m) return toast('No measurement to undo');
  scene.remove(m.obj); m.el.remove(); toast('Measurement #' + (S.meas.length + 1) + ' undone');
}
function clearMeasures(){ for (const m of S.meas){ scene.remove(m.obj); m.el.remove(); } S.meas = []; clearPending(); }
function readout(sn){
  const ro = $('readout'); if (!sn){ ro.hidden = true; return; }
  const x = sn.p.x * 1000 + C0[0], y = -sn.p.z * 1000 + C0[1], z = sn.p.y * 1000 + C0[2];
  const names = {corner: 'Corner', mid: 'Midpoint', centre: 'Centre', grid: 'Grid', surface: 'Surface'};
  ro.hidden = false; ro.textContent = `${names[sn.kind]} · X ${fmt(x)} · Y ${fmt(y)} · Z ${fmt(z)}`;
}

/* ---------------- section ---------------- */
function applyCut(){
  if (!S.cut){ clipPlanes.length = 0; } else {
    const b = new THREE.Box3(); for (const p of parts) b.union(p.box);
    const t = S.cut.pos / 1000; let pl;
    const lerp = (a, c) => a + (c - a) * t;
    if (S.cut.dir === 'top') pl = new THREE.Plane(new THREE.Vector3(0, -1, 0), lerp(b.min.y, b.max.y));
    if (S.cut.dir === 'left') pl = new THREE.Plane(new THREE.Vector3(1, 0, 0), -lerp(b.min.x, b.max.x));
    if (S.cut.dir === 'right') pl = new THREE.Plane(new THREE.Vector3(-1, 0, 0), lerp(b.min.x, b.max.x));
    if (S.cut.dir === 'front') pl = new THREE.Plane(new THREE.Vector3(0, 0, -1), lerp(b.min.z, b.max.z));
    if (S.cut.dir === 'back') pl = new THREE.Plane(new THREE.Vector3(0, 0, 1), -lerp(b.min.z, b.max.z));
    clipPlanes.length = 0; clipPlanes.push(pl);
  }
  scene.traverse(o => { if (o.material && 'clippingPlanes' in o.material){ o.material.needsUpdate = true; } });
  occCache.key = '';
}

/* ---------------- MTO export (same format as Yang's MTO builder) ---------------- */
function mtoSpec(ids){
  const pick = ids && ids.length ? new Set(ids) : null;
  const units = [];
  D.unitKeys.forEach((u, ui) => {
    const rows = {}; for (const c of D.cats) rows[c.code] = [];
    const agg = new Map();
    for (const p of parts){
      if (p.unit !== ui || (pick && !pick.has(p.i))) continue;
      const cat = D.cats.find(c => c.layers.includes(p.layer)).code;
      let k, rec;
      if (p.plate){ k = [cat, p.t, p.prof, p.plate.L, p.plate.W, p.plate.t, p.plate.tri, p.desc].join('|'); rec = {cat, t: p.t, prof: p.prof, plate: p.plate, desc: p.desc, L: p.plate.L}; }
      else { const L = Math.round(p.L); k = [cat, p.t, p.prof, L].join('|'); rec = {cat, t: p.t, prof: p.prof, L}; }
      if (p.rail === 'top') rec.run = true;
      if (p.mto){ rec.mto = p.mto; k += '|' + JSON.stringify(p.mto); }
      k += '|' + (rec.run ? 'run' : '');
      if (!agg.has(k)) agg.set(k, Object.assign(rec, {n: 0, src: (p.ref && p.ref !== p.t ? `Ref ${p.ref}; ` : '') + p.src, grade: (p.grade || D.meta.grade || '*S275').split(' (')[0], mdesc: p.mto_desc, msrc: p.mto_src})); agg.get(k).n++;
    }
    [...agg.values()].sort((a, b) => a.cat < b.cat ? -1 : a.cat > b.cat ? 1 : (!!a.plate) - (!!b.plate) || (a.t < b.t ? -1 : a.t > b.t ? 1 : a.L - b.L)).forEach(a => {
      const pf = D.profs[a.prof] || {};
      if (a.mto){ const m = a.mto;
        rows[a.cat].push({kind: m.kind, uom: m.uom, cat: m.cat ?? pf.cat, grade: a.grade, desc: m.desc ?? a.mdesc ?? a.prof, mark: a.t, kgm: m.kgm,
          len: m.len ?? (a.plate ? a.plate.L : a.L), wid: m.wid ?? (a.plate ? a.plate.W : undefined), qty: a.n, set: m.set ?? 1, run: a.run, src: m.src ?? a.src, assumed: m.assumed}); }
      else if (a.plate) rows[a.cat].push({kind: 'plate', cat: 'Plate', grade: a.grade, desc: `PL${a.plate.t} ${a.desc}` + (a.plate.tri ? ' - triangles nested 2 per rectangle' : ''), mark: a.t,
        len: a.plate.L, wid: a.plate.W, thk: a.plate.t, qty: a.plate.tri ? a.n / 2 : a.n, set: 1, src: `${a.src}; plate 7.85`});
      else rows[a.cat].push({kind: 'length', d: pf.d, w: pf.w, t: pf.t, cat: pf.cat, grade: a.grade, desc: a.mdesc || a.prof, mark: a.t, kgm: pf.kgm, m2m: pf.m2m, len: a.L, qty: a.n, set: 1,
        run: a.run, assumed: pf.m2m_assumed ? ['m2m'] : undefined,
        src: a.msrc ? `${a.msrc}; ${pf.src}` : `${a.src}; cut length from 3D model (clipped to bearing faces); ${pf.src}`});
    });
    if (pick && !Object.values(rows).some(r => r.length)) return;
    units.push({name: (D.meta.unit_names || {})[u] || u, rows});
  });
  return {header: D.header, currency: D.meta.currency, unit_label: 'unit', grand_total_label: D.meta.grand_total_label, allowance: 0,
    categories: D.cats.map(c => ({code: c.code, title: c.title, dwg: c.dwg})), units, assumptions: D.assumptions, left_out: D.left, decisions: D.decisions || [], cautions: D.cautions || []};
}
function colL(n){ let s = ''; while (n > 0){ const m = (n - 1) % 26; s = String.fromCharCode(65 + m) + s; n = Math.floor((n - 1) / 26); } return s; }
/*@@MTO_PORT@@*/
async function doExport(){
  if (typeof ExcelJS === 'undefined') return toast('Spreadsheet library did not load - check the connection and reload');
  const dl = window.claude ? await window.claude.use('downloads') : null;
  if (!dl) return toast('Saving files is not available in this view');
  const ids = S.sel.length ? S.sel : null;
  const spec = mtoSpec(ids);
  const wb = buildWorkbook(spec); const buf = await wb.xlsx.writeBuffer();
  const tag = ids ? '_' + ((S.selChain[S.selLevel] && S.selChain[S.selLevel].g !== undefined) ? D.groups[S.selChain[S.selLevel].g].name : (S.selName || 'selection')).replace(/[^A-Za-z0-9]+/g, '-').replace(/^-|-$/g, '').slice(0, 40) : '';
  try { await dl.save({filename: `${D.meta.export_prefix}${tag}_MTO.xlsx`, data: new Blob([buf])}); toast('Saved MTO workbook'); }
  catch (e){ toast(e && e.code === 'declined' ? 'Save cancelled' : 'Could not save: ' + (e && e.code || 'unknown')); }
}

function fillCard(){
  const c = D.meta.card;
  $('cTitle').textContent = c.title; $('cDesc').textContent = c.desc; $('cRef').textContent = c.ref;
  const steel = parts.filter(p => !(p.mto && p.mto.kind === 'measure'));   // bondek package: counted in m2 / m / pcs, not steel kg
  const kg = steel.reduce((a, p) => a + p.kg, 0);
  $('cCount').innerHTML = `${fmt(steel.length)} steel parts · <b>${fmt(kg, 1)} kg</b>`;
}

/* ---------------- main ---------------- */
async function main(){
  try { D = await loadData(); } catch (e){ $('load').textContent = e.message; return; }
  prepParts();
  const view = $('view');
  renderer = new THREE.WebGLRenderer({antialias: true, alpha: true}); renderer.setClearColor(0xffffff, 0); renderer.localClippingEnabled = true; renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  view.insertBefore(renderer.domElement, $('ov')); $('load').remove();
  scene = new THREE.Scene();
  camera = new THREE.PerspectiveCamera(40, 1, 0.05, 2000); camera.up.set(0, 1, 0);
  scene.add(new THREE.HemisphereLight(0xffffff, 0x5a6270, 0.75)); const dl = new THREE.DirectionalLight(0xffffff, 0.75); dl.position.set(40, 80, 30); scene.add(dl);
  const dl2 = new THREE.DirectionalLight(0xffffff, 0.3); dl2.position.set(-50, 20, -40); scene.add(dl2);
  controls = new THREE.OrbitControls(camera, renderer.domElement);
  controls.enableZoom = false; controls.screenSpacePanning = true; controls.enableDamping = true; controls.dampingFactor = 0.12;
  controls.mouseButtons = {LEFT: THREE.MOUSE.ROTATE, MIDDLE: THREE.MOUSE.PAN, RIGHT: THREE.MOUSE.PAN};
  const all = new THREE.Box3(); for (const p of parts) all.union(p.box); diag = all.getSize(new THREE.Vector3()).length();
  buildGhosts(); buildLayers(); buildPanel(); fillCard(); buildGrid(); setupMeasure();
  const resize = () => { const r = view.getBoundingClientRect(); renderer.setSize(r.width, r.height, false); camera.aspect = r.width / Math.max(r.height, 1); camera.updateProjectionMatrix(); occCache.key = ''; };
  new ResizeObserver(resize).observe(view); resize();
  camera.position.set(0, 20, 60); controls.target.set(0, 5, 0); preset('iso'); if (fly){ camera.position.copy(fly.p1); controls.target.copy(fly.t1); fly = null; } controls.update();
  view.addEventListener('wheel', onWheel, {passive: false, capture: true});
  // pointer: click select / measure
  let down = null;
  renderer.domElement.addEventListener('pointerdown', e => { down = {x: e.clientX, y: e.clientY, b: e.button}; });
  renderer.domElement.addEventListener('pointermove', e => {
    if (!S.measure) return;
    const sn = snapAt(e.clientX, e.clientY);
    if (sn){ snapMarker.visible = true; snapMarker.material = MK[sn.kind]; snapMarker.position.copy(sn.p); const d = camera.position.distanceTo(sn.p); snapMarker.scale.setScalar(d * 0.03); } else snapMarker.visible = false;
    readout(sn);
    if (S.pending && sn){
      const lk = lockB(S.pending, sn, e.shiftKey);
      rubber.geometry.setFromPoints([S.pending.p, lk.p]); rubber.visible = true;
      if (lk.locked){ guideLine.geometry.setFromPoints([lk.p, sn.p]); guideLine.computeLineDistances(); guideLine.visible = true; } else guideLine.visible = false;
    }
  });
  renderer.domElement.addEventListener('pointerup', e => {
    if (!down || Math.hypot(e.clientX - down.x, e.clientY - down.y) > 5 || down.b !== 0){ down = null; return; } down = null;
    if (S.measure){
      const sn = snapAt(e.clientX, e.clientY); if (!sn) return;
      if (!S.pending){ S.pending = sn; const s = new THREE.Sprite(MK.corner); s.position.copy(sn.p); s.scale.setScalar(camera.position.distanceTo(sn.p) * 0.03); s.renderOrder = 10; scene.add(s); S.pendingObj = s; s.visible = S.labels; }
      else { addMeasurement(S.pending, sn, e.shiftKey); clearPending(); }
      return;
    }
    const h = pickAt(e.clientX, e.clientY);
    S.inst = null;
    if (!h){ select([], [], 0); return; }
    if (S.selChain.length && S.selChain[0].ids.length === 1 && S.selChain[0].ids[0] === h.i){
      const k = (S.selLevel + 1) % S.selChain.length; S.selLevel = k; S.sel = S.selChain[k].ids; updateSelMesh(); renderInfo();
    } else { const ch = chainFor(h.i); select(ch[0].ids, ch, 0); }
  });
  // buttons
  $('vIso').onclick = () => preset('iso'); $('vPlan').onclick = () => preset('plan'); $('vFront').onclick = () => preset('front'); $('vSide').onclick = () => preset('side');
  $('bGrid').onclick = () => { S.grid = !S.grid; $('bGrid').classList.toggle('on', S.grid); gridGroup.visible = S.grid; };
  $('bMeas').onclick = $('bMeas2').onclick = () => setMeasure(!S.measure);
  $('bClrMeas').onclick = clearMeasures;
  $('bOnly').onclick = showOnly; $('bShowAll').onclick = showAll; $('bHide').onclick = hideSel; $('bUndo').onclick = undo;
  $('bSelAll').onclick = () => { const ids = parts.filter(p => visible(p.i)).map(p => p.i); S.selName = 'All modelled steel'; select(ids, [{name: 'All', ids}], 0); };
  $('bExport').onclick = doExport;
  $('bPrev').onclick = () => stepInst(-1); $('bNext').onclick = () => stepInst(1);
  $('bAllInst').onclick = () => { if (!S.inst) return; select(S.inst, [{name: S.selName, ids: S.inst}], 0); fitIds(S.inst, true); };
  $('q').oninput = doSearch;
  const setLabels = on => { S.labels = on; $('cLabels').checked = on; $('bLab').classList.toggle('on', on); };
  $('cLabels').onchange = e => setLabels(e.target.checked);
  $('bLab').onclick = () => setLabels(!S.labels);
  $('cutOn').onclick = () => { S.cut = {dir: $('cutDir').value, pos: +$('cutPos').value}; applyCut(); };
  $('cutOff').onclick = () => { S.cut = null; applyCut(); };
  $('cutDir').onchange = () => { if (S.cut){ S.cut.dir = $('cutDir').value; applyCut(); } };
  $('cutPos').oninput = () => { if (!S.cut) S.cut = {dir: $('cutDir').value, pos: 500}; S.cut.pos = +$('cutPos').value; applyCut(); };
  window.addEventListener('keydown', e => {
    if (e.target.tagName === 'INPUT' && e.target.type === 'text') return;
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'z'){ e.preventDefault(); if (S.measure) undoMeasure(); else undo(); return; }
    if (e.key === 'h' || e.key === 'H') hideSel();
    else if (e.key === 'm' || e.key === 'M') setMeasure(!S.measure);
    else if (e.key === 'Escape'){ if (S.measure){ if (S.pending) clearPending(); else setMeasure(false); } else select([], [], 0); }
  });
  matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => { if (selMesh) selMesh.material.color.set(css('--sel')); });
  document.fonts && document.fonts.ready.then(() => { occCache.key = ''; });
  // loop
  const loop = () => {
    requestAnimationFrame(loop);
    if (fly){ const t = Math.min(1, (performance.now() - fly.s) / 450), e = t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
      camera.position.lerpVectors(fly.p0, fly.p1, e); controls.target.lerpVectors(fly.t0, fly.t1, e); if (t >= 1) fly = null; }
    controls.update();
    const dist = camera.position.distanceTo(controls.target);
    camera.near = Math.min(1, Math.max(0.01, dist * 0.01)); camera.far = Math.max(4 * diag, dist * 4); camera.updateProjectionMatrix();
    renderer.render(scene, camera); placeLabels();
  };
  loop();
  window.__model = {S, parts, mtoSpec, camera, controls};
}
main();
</script>
